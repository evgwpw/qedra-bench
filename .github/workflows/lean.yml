name: lean

# L4: проверка сертификатов HasDerivAt на раннере qedra-bench (карточка L4 в docs/tasks/lean1.md репозитория lisp).
# Вход — снимок evgwpw/Qedra с каталогом lean/catalog/*.lean; шапка одного пакета несёт import,
# поэтому N теорем проверяются одним процессом Lean. Статус ставится по каждой теореме,
# passed — только если она скомпилировалась и её аксиомы ⊆ {propext, Classical.choice, Quot.sound}.

"on":
  workflow_dispatch:
    inputs:
      qedra_ref:
        description: Ветка/тег снимка evgwpw/Qedra (каталог теорем в lean/catalog)
        default: rubi-pilot
        required: true
      source:
        description: "catalog — lean/catalog/*.lean из снимка; pilot — корпус LEAN.PILOT (pilot_pack)"
        default: catalog
        required: true
      pilot_pack:
        description: "gz корпуса пилота в этом репозитории (source=pilot), см. research/lean/pilot.mjs --pack"
        default: lean/pilot/sample-500x2.gz
        required: false
      run_label:
        description: "суффикс каталога results (иначе прогоны того же снимка затирают друг друга)"
        default: ""
        required: false
      shards:
        description: Число осколков (по одному job на осколок)
        default: "4"
        required: true
      timeout_s:
        description: Таймаут на пакет, секунды
        default: "900"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        env:
          N: ${{ inputs.shards }}
        run: echo "shards=$(node -e 'console.log(JSON.stringify(Array.from({length:+process.env.N},(_,i)=>String(i+1))))')" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Снимок Qedra (каталог теорем)
        run: |
          git clone --quiet --depth 1 --branch "${{ inputs.qedra_ref }}" https://github.com/evgwpw/Qedra.git snapshot
          mkdir -p lean/catalog research/lean
          if [ "${{ inputs.source }}" = "catalog" ]; then
            cp snapshot/lean/catalog/*.lean lean/catalog/
          else
            # корпус пилота уже собран снимком генератора: в репозитории лежит один gz
            node tools/lean/unpack.mjs "${{ inputs.pilot_pack }}" lean/pilot
          fi
          echo "snapshot $(git -C snapshot rev-parse HEAD)" > snapshot.sha

      - name: Проект с mathlib (пины версий из tools/lean/setup)
        run: |
          mkdir -p qedra-lean
          cp tools/lean/setup/lean-toolchain tools/lean/setup/lakefile.lean tools/lean/setup/lake-manifest.json qedra-lean/

      - name: elan и toolchain из lean-toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Кэш олеанов mathlib
        uses: actions/cache@v4
        with:
          path: qedra-lean/.lake
          key: lean-oleans-${{ hashFiles('tools/lean/setup/lake-manifest.json') }}

      - name: Зависимости и олеаны mathlib
        working-directory: qedra-lean
        run: |
          if [ ! -d .lake/packages/mathlib ]; then lake update mathlib; fi
          lake exe cache get
          df -h . || true
          du -sh .lake || true
          cat lean-toolchain

      - name: Пакет и проверка осколка
        env:
          LEAN_TIMEOUT_MS: ${{ format('{0}000', inputs.timeout_s) }}
        run: |
          if [ "${{ inputs.source }}" = "catalog" ]; then dir=lean/catalog; else dir=lean/pilot; fi
          mapfile -t all < <(ls "$dir"/*.lean | sed 's#.*/##; s#\.lean$##' | sort)
          n=${#all[@]}
          per=$(( (n + ${{ inputs.shards }} - 1) / ${{ inputs.shards }} ))
          start=$(( (${{ matrix.shard }} - 1) * per ))
          mine=( "${all[@]:start:per}" )
          echo "осколок ${{ matrix.shard }}: ${#mine[@]} пакетов из $n"
          if [ "${#mine[@]}" -eq 0 ]; then echo "осколок пуст — это ошибка, а не успех"; exit 1; fi
          if [ "${{ inputs.source }}" = "catalog" ]; then
            # каталог: по теореме на файл, пакет собирается здесь
            node tools/lean/gen-batch.mjs --narrow --out-dir lean/batch "${mine[@]}"
            node tools/lean/check-batch.mjs lean/batch/shard-1.lean
          else
            # пилот: пакеты уже собраны генератором (шапка + #print axioms внутри)
            files=(); for id in "${mine[@]}"; do files+=("$dir/$id.lean"); done
            node tools/lean/check-batch.mjs "${files[@]}"
          fi
          # пустой файл результатов — признак сбоя конвейера, а не «нечего проверять»
          test -s research/lean/batch-results.jsonl || { echo "нет результатов проверки"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-${{ matrix.shard }}
          path: |
            research/lean/batch-results.jsonl
            lean/pilot/index.jsonl
            lean/pilot/not-generated.jsonl
            lean/pilot/meta.json
            snapshot.sha
          if-no-files-found: warn

  merge:
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # main мог уйти вперёд за время прогона — берём свежий main и делаем rebase перед push
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Сводка
        env:
          QEDRA_REF: ${{ inputs.qedra_ref }}
          SHARDS: ${{ inputs.shards }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
        run: |
          if [ -n "${{ inputs.run_label }}" ]; then
            export RUN_LABEL="lean-$(date -u +%Y-%m-%d)-${{ inputs.run_label }}"
          fi
          node tools/lean/summarize.mjs artifacts

      - name: Коммит результатов
        run: |
          git config user.name "Evgeniy Veprikov"
          git config user.email "10131262+evgwpw@users.noreply.github.com"
          git add results
          git commit -m "Lean results for ${{ inputs.qedra_ref }} (${{
            inputs.shards }} shards, timeout ${{ inputs.timeout_s }} s)" || echo "no changes"
          git pull --rebase origin main
          git push
